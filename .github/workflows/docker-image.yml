name: Insurance Integration Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Build & push Docker image
      uses: mr-smithers-excellent/docker-build-push@v7
      with:
        image: rijan17/insurance-integration-cicd
        tags: latest
        registry: docker.io
        dockerfile: Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

  success_notify:
    needs: ['build']
    if: always() && !failure()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Success
        run: echo "Success email sent to the team"

  failure_notify:
    needs: ['build']
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify Failure
        run: echo "Failure email sent to the team"

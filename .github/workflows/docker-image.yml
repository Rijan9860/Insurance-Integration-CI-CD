name: Insurance Integration Docker Image CI/CD

on:
  push:
    branches: ["develop"]

  pull_request:
    branches: ["main"]

jobs:

  build:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: rijan17/insurance-integration-cicd
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  deploy:
    if: github.base_ref == 'main' && github.event_name == 'pull_request'
    runs-on: self-hosted

    steps:
      - name: Pull latest docker image
        run: |
          docker pull rijan17/insurance-integration-cicd:latest

      - name: Stop old container
        run: docker stop insurance-integration || true

      - name: Remove old container
        run: docker rm insurance-integration || true

      - name: Start new container
        run: docker compose up -d insurance-integration
